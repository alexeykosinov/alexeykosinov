# Custom FTDI FT4232H adapter where channel A is wired as JTAG.
#
# FT4232H USB IDs are normally 0403:6011. If the EEPROM programmed by the
# Xilinx program_ftdi utility uses another VID/PID, pass them on the OpenOCD
# command line before sourcing openocd.cfg:
#
#   -c "set FTDI_VID 0x0403" -c "set FTDI_PID 0x6011"
#
# If several adapters are attached, select this one by serial:
#
#   -c "set FTDI_SERIAL your-serial-string"
#
# Expected channel A MPSSE wiring:
#   ADBUS0 / TCK / SK  -> RFSoC TCK
#   ADBUS1 / TDI / DO  -> RFSoC TDI
#   ADBUS2 / TDO / DI  <- RFSoC TDO
#   ADBUS3 / TMS / CS  -> RFSoC TMS
#   GND                -> board GND
#   VREF/level shifting must match the board JTAG bank voltage.
#
# Other FT4232H channels can remain UARTs; OpenOCD only opens FTDI channel 0.

adapter driver ftdi

if {![info exists FTDI_VID]} {
    set FTDI_VID 0x0403
}

if {![info exists FTDI_PID]} {
    set FTDI_PID 0x6011
}

if {![info exists FTDI_CHANNEL]} {
    set FTDI_CHANNEL 0
}

ftdi vid_pid $FTDI_VID $FTDI_PID

if {[info exists FTDI_SERIAL] && $FTDI_SERIAL ne ""} {
    ftdi serial $FTDI_SERIAL
}

ftdi channel $FTDI_CHANNEL

# Standard MPSSE JTAG pins on the low byte:
#   bit 0 TCK output, idle low
#   bit 1 TDI output, idle low
#   bit 2 TDO input
#   bit 3 TMS output, idle high
#
# data = 0x0008 keeps TMS high while idle.
# dir  = 0x000b drives TCK, TDI and TMS; TDO remains input.
ftdi layout_init 0x0008 0x000b

# Do not define nSRST/nTRST here. On many custom FT4232 boards the remaining
# pins are UART/control signals, so reset handling is intentionally disabled in
# ../openocd.cfg with "reset_config none".
