# Minimal OpenOCD configuration for Xilinx Zynq UltraScale+ RFSoC/MPSoC
# with a custom FTDI FT4232H adapter where channel A is wired as JTAG.
#
# Usage example:
#   openocd \
#     -f rfsoc-openocd/openocd.cfg
#
# Command-line overrides:
#   -c "set FTDI_VID 0x0403"
#   -c "set FTDI_PID 0x6011"
#   -c "set FTDI_CHANNEL 0"
#   -c "set FTDI_SERIAL your-serial-string"
#   -c "set JTAG_SPEED_KHZ 15000"
#
# Expected FT4232H channel A MPSSE wiring:
#   ADBUS0 / TCK / SK  -> RFSoC TCK
#   ADBUS1 / TDI / DO  -> RFSoC TDI
#   ADBUS2 / TDO / DI  <- RFSoC TDO
#   ADBUS3 / TMS / CS  -> RFSoC TMS
#   GND                -> board GND
#   VREF/level shifting must match the board JTAG bank voltage.
# Other FT4232H channels can remain UARTs; OpenOCD only opens channel 0 by
# default.

adapter driver ftdi

if {![info exists FTDI_VID]} {
    set FTDI_VID 0x0403
}

if {![info exists FTDI_PID]} {
    set FTDI_PID 0x6011
}

if {![info exists FTDI_CHANNEL]} {
    set FTDI_CHANNEL 0
}

if {![info exists JTAG_SPEED_KHZ]} {
    set JTAG_SPEED_KHZ 10000
}

ftdi vid_pid $FTDI_VID $FTDI_PID

if {[info exists FTDI_SERIAL] && $FTDI_SERIAL ne ""} {
    ftdi serial $FTDI_SERIAL
}

ftdi channel $FTDI_CHANNEL

# Standard MPSSE JTAG pins on the low byte:
#   bit 0 TCK output, idle low
#   bit 1 TDI output, idle low
#   bit 2 TDO input
#   bit 3 TMS output, idle high
#
# data = 0x0008 keeps TMS high while idle.
# dir  = 0x000b drives TCK, TDI and TMS; TDO remains input.
ftdi layout_init 0x0008 0x000b

transport select jtag
adapter speed $JTAG_SPEED_KHZ

# RFSoC devices use the same PS debug architecture as Zynq UltraScale+ MPSoC.
source [find target/xilinx_zynqmp.cfg]

# Keep reset handling conservative; many custom RFSoC boards do not wire SRST
# to the JTAG adapter.
reset_config none
