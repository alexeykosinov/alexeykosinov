# Minimal OpenOCD configuration for Xilinx Zynq UltraScale+ RFSoC/MPSoC.
#
# Usage example:
#   openocd \
#     -f rfsoc-openocd/openocd.cfg \
#     -c "set FSBL_ELF /abs/path/fsbl.elf" \
#     -c "set UBOOT_ELF /abs/path/u-boot.elf" \
#     -f rfsoc-openocd/scripts/load-fsbl-uboot.tcl
#
# Override these from the command line when your cable or OpenOCD package uses
# another interface file, for example:
#   -c "set JTAG_INTERFACE interface/ftdi/digilent-hs2.cfg"
#   -c "set JTAG_SPEED_KHZ 15000"

if {![info exists JTAG_INTERFACE]} {
    # Common default for Xilinx/Digilent FTDI-based adapters.
    # Other frequent choices:
    #   interface/ftdi/digilent-hs1.cfg
    #   interface/ftdi/digilent-hs2.cfg
    #   interface/cmsis-dap.cfg
    #   interface/jlink.cfg
    set JTAG_INTERFACE interface/ftdi/digilent-hs2.cfg
}

if {![info exists JTAG_SPEED_KHZ]} {
    set JTAG_SPEED_KHZ 10000
}

source [find $JTAG_INTERFACE]
transport select jtag
adapter speed $JTAG_SPEED_KHZ

# RFSoC devices use the same PS debug architecture as Zynq UltraScale+ MPSoC.
source [find target/xilinx_zynqmp.cfg]

# Keep reset handling conservative; many custom RFSoC boards do not wire SRST
# to the JTAG adapter.
reset_config none
